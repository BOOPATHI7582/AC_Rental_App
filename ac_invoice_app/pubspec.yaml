name: ac_invoice_app
description: AC Rental Business Invoice App (Tiruppur) - Create, view, share and download GST invoices.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Local persistence
  shared_preferences: ^2.2.2

  # PDF generation + share/print
  pdf: ^3.10.7
  printing: ^5.11.1

  # Pick logo / signature images
  image_picker: ^1.0.7

  # Save files to app storage
  path_provider: ^2.1.2

  # Dates, number formatting
  intl: ^0.19.0

  # Unique ids
  uuid: ^4.3.3

  # HTTP calls
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # ==========================================
  # APP ASSETS
  # ==========================================
  assets:
    - assets/images/elite_air_comfort_logo.png